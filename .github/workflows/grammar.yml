name: grammar
on:
  push:
    branches: [main]
    paths: [spec/grammar.ebnf, spec/grammar.md, spec/tree-sitter-lmcode.md, README.md, DIVERGENCES.md, tests/grammar/**, .github/workflows/grammar.yml]
  pull_request:
    paths: [spec/grammar.ebnf, spec/grammar.md, spec/tree-sitter-lmcode.md, README.md, DIVERGENCES.md, tests/grammar/**, .github/workflows/grammar.yml]
  workflow_dispatch:
    inputs:
      compiler_version:
        description: 'Published npm version/tag; blank uses repository variable or pin'
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: grammar-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COMPILER_VERSION: ${{ inputs.compiler_version || vars.LMCODE_COMPILER_VERSION }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check out the conformance/sample corpora
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: lmctl-ai/lmcode-cpp
          ref: 6ee3d62ea9b480aa6f42a592055233959f7f6162
          path: corpora/lmcode-cpp
          persist-credentials: false
      - name: Check out the lmok rule corpus
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: lmctl-ai/lmok
          ref: 128dc03224e95ed6671af81ed73f172f8233e7d3
          path: corpora/lmok
          persist-credentials: false
      - name: Check out the pinned Tree-sitter grammars
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: lmctl-ai/tree-sitter-lmscript
          ref: ff301218f388f30fcf40cd63d235070c162aa283
          path: corpora/tree-sitter-lmscript
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: lmctl-ai/tree-sitter-lmcode
          ref: c9d5021cc98982f558937298e4add9a4f79c574a
          path: corpora/tree-sitter-lmcode
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Install lark into a private venv
        run: |
          python -m venv .venv-grammar
          .venv-grammar/bin/pip install --quiet -r scripts/ci/requirements.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Install the published compiler into a private npm prefix
        run: bash scripts/ci/install-compiler.sh
      - name: Check return grammar controls
        run: .venv-grammar/bin/python -m unittest discover -s tests/grammar -p 'test_*.py' -v
      - name: Parse the full corpus with the grammar (zero failures required)
        run: |
          LMCODE_CPP="$GITHUB_WORKSPACE/corpora/lmcode-cpp" LMOK="$GITHUB_WORKSPACE/corpora/lmok" \
            .venv-grammar/bin/python tests/grammar/check_corpus.py
      - name: Differential accept/reject against the real compiler
        run: |
          LMCODE_CPP="$GITHUB_WORKSPACE/corpora/lmcode-cpp" \
            .venv-grammar/bin/python tests/grammar/mutate_diff.py
      - name: Install pinned npm oracle and Tree-sitter CLI
        run: |
          npm install --prefix "$RUNNER_TEMP/tree-sitter-diff" --no-audit --no-fund \
            @lmctl-ai/lmctl@0.2.450 tree-sitter-cli@0.27.1
          (cd "$RUNNER_TEMP/tree-sitter-diff/node_modules/tree-sitter-cli" && node install.js)
          echo "LMSCRIPT_BIN=$RUNNER_TEMP/tree-sitter-diff/node_modules/.bin/lmscript" >> "$GITHUB_ENV"
          echo "TREE_SITTER=$RUNNER_TEMP/tree-sitter-diff/node_modules/.bin/tree-sitter" >> "$GITHUB_ENV"
          echo "TREE_SITTER_LMSCRIPT_ROOT=$GITHUB_WORKSPACE/corpora/tree-sitter-lmscript" >> "$GITHUB_ENV"
          echo "TREE_SITTER_LMCODE_ROOT=$GITHUB_WORKSPACE/corpora/tree-sitter-lmcode" >> "$GITHUB_ENV"
      - name: Differential gate across both pinned grammars
        env:
          LMCODE_CPP: ${{ github.workspace }}/corpora/lmcode-cpp
          LMOK: ${{ github.workspace }}/corpora/lmok
        run: python3 tests/grammar/tree_sitter_differential.py --json "$RUNNER_TEMP/tree-sitter-diff-report.json"
      - name: Corrupt-grammar negative control
        env:
          LMSCRIPT_BIN: ${{ runner.temp }}/tree-sitter-diff/node_modules/.bin/lmscript
          TREE_SITTER: ${{ runner.temp }}/tree-sitter-diff/node_modules/.bin/tree-sitter
          TREE_SITTER_LMSCRIPT_ROOT: ${{ github.workspace }}/corpora/tree-sitter-lmscript
          TREE_SITTER_LMCODE_ROOT: ${{ github.workspace }}/corpora/tree-sitter-lmcode
        run: python3 -m unittest discover -s tests/grammar -p 'test_tree_sitter_differential.py' -v
